<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flash VPN ⚡️ SNI Tunnel İçe Aktar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }
    .icon {
      font-size: 54px;
      margin-bottom: 16px;
      display: inline-block;
      animation: pulse 1.5s infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.1); }
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #38bdf8;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      margin-bottom: 12px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
    .btn-primary:active {
      transform: scale(0.98);
    }
    .btn-secondary {
      background-color: #334155;
      color: #e2e8f0;
      font-size: 14px;
      padding: 10px 16px;
    }
    .status {
      font-size: 13px;
      color: #22c55e;
      margin-top: 14px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⚡️</div>
    <h1>SNI Tunnel'a Aktarılıyor</h1>
    <p>İnternet dosyanız SNI Tunnel uygulamasına otomatik yükleniyor...</p>

    <a id="open-btn" class="btn btn-primary" href="#">Uygulamada Aç (BAŞLAT)</a>
    <button id="copy-btn" class="btn btn-secondary">Kodu Panoya Kopyala</button>

    <div id="status" class="status"></div>
  </div>

  <script>
    (function() {
      var hash = window.location.hash.substring(1);
      if (!hash) {
        document.getElementById('status').innerText = 'Geçersiz veya boş yapılandırma bağlantısı.';
        document.getElementById('status').style.color = '#ef4444';
        return;
      }

      var config = decodeURIComponent(hash);
      var targetUrl = 'snitunnel://add/' + config;

      var openBtn = document.getElementById('open-btn');
      openBtn.href = targetUrl;

      // Copy fallback
      document.getElementById('copy-btn').addEventListener('click', function() {
        navigator.clipboard.writeText(config).then(function() {
          document.getElementById('status').innerText = '✅ Kod panoya kopyalandı!';
        });
      });

      // Try automatic redirect
      setTimeout(function() {
        window.location.href = targetUrl;
      }, 250);
    })();
  </script>
</body>
</html>
